<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Finance Dashboard</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-wallet"></i>
            <h1>FinHub</h1>
            <p>Login to your account</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-toggle">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle-btn" id="passwordToggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="remember-forgot">
                <label class="checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    <span>Remember me</span>
                </label>
                <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="divider">or</div>

        <div class="social-login">
            <button type="button" class="social-btn" title="Google">
                <i class="fab fa-google"></i>
            </button>
            <button type="button" class="social-btn" title="GitHub">
                <i class="fab fa-github"></i>
            </button>
            <button type="button" class="social-btn" title="Microsoft">
                <i class="fab fa-microsoft"></i>
            </button>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="register.html">Sign up here</a>
        </div>
    </div>

    <script src="app.js" defer></script>
    <script src="auth.js" defer></script>
</body>
</html>
