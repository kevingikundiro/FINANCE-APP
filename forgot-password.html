<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Finance Dashboard</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-unlock-alt"></i>
                <h1>Reset Password</h1>
                <p>Enter your email to reset your Finance Dashboard password.</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="emailForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    <div class="error-message" id="emailError"></div>
                </div>
                <button type="submit">Submit</button>
            </form>

            <div id="resetSection" class="password-requirements hidden" style="margin-top: 24px;">
                <form id="resetForm">
                    <div class="form-group">
                        <label for="resetPassword">New Password</label>
                        <div class="password-toggle">
                            <input type="password" id="resetPassword" name="resetPassword" placeholder="Enter a new password" required>
                            <button type="button" id="resetPasswordToggle" class="password-toggle-btn"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="error-message" id="resetPasswordError"></div>
                    </div>
                    <div class="form-group">
                        <label for="resetConfirmPassword">Confirm Password</label>
                        <div class="password-toggle">
                            <input type="password" id="resetConfirmPassword" name="resetConfirmPassword" placeholder="Confirm your new password" required>
                            <button type="button" id="resetConfirmPasswordToggle" class="password-toggle-btn"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="error-message" id="resetConfirmPasswordError"></div>
                    </div>
                    <div class="password-requirements" id="passwordRequirements">
                        <div class="requirement" id="reqLength"><i class="fas fa-times-circle"></i> At least 8 characters</div>
                        <div class="requirement" id="reqUppercase"><i class="fas fa-times-circle"></i> Uppercase letter</div>
                        <div class="requirement" id="reqNumber"><i class="fas fa-times-circle"></i> Number</div>
                        <div class="requirement" id="reqSpecial"><i class="fas fa-times-circle"></i> Special character</div>
                    </div>
                    <button id="resetPasswordBtn" type="submit">Reset Password</button>
                </form>
            </div>

            <div class="auth-footer">
                Remembered your password? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>
    <script src="app.js" defer></script>
    <script src="auth.js" defer></script>
</body>
</html>
